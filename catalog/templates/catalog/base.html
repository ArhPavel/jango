{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Каталог{% endblock %}</title>
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>

  <header class="py-3 mb-4 border-bottom">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <a href="{% url 'catalog:category_list' %}" class="text-dark text-decoration-none fs-4 fw-bold">Магазин</a>
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url 'catalog:category_list' %}" class="nav-link">Каталог</a></li>
        <li class="nav-item"><a href="{% url 'blog:post_list' %}" class="nav-link">Блог</a></li>
      </ul>
    </div>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  {# {% include 'catalog/includes/footer.html' %} #}

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
