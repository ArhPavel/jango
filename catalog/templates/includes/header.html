<header data-bs-theme="dark">
  <div class="navbar navbar-expand-md navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a href="{% url 'catalog:category_list' %}" class="navbar-brand d-flex align-items-center">
        <strong>Каталог</strong>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'catalog:category_list' %}">Все категории</a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Категории
            </a>
            <ul class="dropdown-menu">
              {% for cat in all_categories %}
                <li>
                  <a class="dropdown-item" href="{% url 'catalog:category_products' cat.pk %}">
                    {{ cat.name }}
                  </a>
                </li>
              {% empty %}
                <li><span class="dropdown-item-text text-muted">Категорий нет</span></li>
              {% endfor %}
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
